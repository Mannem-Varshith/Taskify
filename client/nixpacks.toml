[phases.setup]
nixPkgs = ['nodejs_22', 'python3', 'gcc', 'gnumake']

[phases.install]
cmds = [
  'npm ci --legacy-peer-deps || npm install --legacy-peer-deps',
  'npm rebuild lightningcss --legacy-peer-deps'
]

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npm run preview -- --host 0.0.0.0 --port $PORT'
